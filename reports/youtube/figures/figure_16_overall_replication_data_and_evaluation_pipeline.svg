<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1420" viewBox="0 0 2400 1420" role="img" aria-labelledby="title desc">
  <title id="title">Overall VADER replication, new-data creation and evaluation pipeline</title>
  <desc id="desc">A black-and-white end-to-end architecture diagram. It shows replication on original VADER materials, GoEmotions processing and evaluation, and YouTube collection, processing, human annotation, model scoring and final analysis.</desc>
  <rect width="2400" height="1420" fill="white"/>
  <style>
    .box { fill: white; stroke: black; stroke-width: 3; }
    .line { fill: none; stroke: black; stroke-width: 3; marker-end: url(#arrow); }
    .heading { font-family: Arial, Helvetica, sans-serif; font-size: 36px; font-weight: 700; fill: black; text-anchor: middle; }
    .section { font-family: Arial, Helvetica, sans-serif; font-size: 27px; font-weight: 700; fill: black; text-anchor: middle; }
    .label { font-family: Arial, Helvetica, sans-serif; font-size: 22px; fill: black; text-anchor: middle; }
    .small { font-family: Arial, Helvetica, sans-serif; font-size: 19px; fill: black; text-anchor: middle; }
    .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 17px; fill: black; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="black"/>
    </marker>
  </defs>

  <text x="1200" y="58" class="heading">Overall VADER Replication, New-Data Creation and Evaluation Pipeline</text>

  <text x="450" y="112" class="section">Original-work replication</text>
  <rect x="80" y="145" width="270" height="130" rx="8" class="box"/>
  <text x="215" y="180" class="label">Original VADER</text>
  <text x="215" y="208" class="label">materials</text>
  <text x="215" y="238" class="small">2014 code, lexicon and</text>
  <text x="215" y="262" class="small">four benchmark datasets</text>

  <rect x="465" y="145" width="270" height="130" rx="8" class="box"/>
  <text x="600" y="188" class="label">Replication</text>
  <text x="600" y="220" class="small">run the historical VADER</text>
  <text x="600" y="246" class="small">implementation on original data</text>

  <rect x="850" y="145" width="270" height="130" rx="8" class="box"/>
  <text x="985" y="180" class="label">Replication</text>
  <text x="985" y="208" class="label">comparison</text>
  <text x="985" y="238" class="small">compare reproduced metrics</text>
  <text x="985" y="262" class="small">with published findings</text>

  <text x="465" y="365" class="section">GoEmotions extension</text>
  <rect x="80" y="400" width="270" height="130" rx="8" class="box"/>
  <text x="215" y="443" class="label">GoEmotions dataset</text>
  <text x="215" y="475" class="small">54,263 agreement-filtered</text>
  <text x="215" y="501" class="small">split records</text>

  <rect x="465" y="400" width="270" height="130" rx="8" class="box"/>
  <text x="600" y="431" class="label">Mapping and</text>
  <text x="600" y="457" class="label">preprocessing</text>
  <text x="600" y="483" class="small">map emotions to sentiment</text>
  <text x="600" y="507" class="small">exclude ambiguous records</text>

  <rect x="850" y="400" width="270" height="130" rx="8" class="box"/>
  <text x="985" y="443" class="label">VADER evaluation</text>
  <text x="985" y="475" class="small">VADER 2014 and v3.3.2</text>
  <text x="985" y="501" class="small">on 45,258 retained records</text>

  <text x="1810" y="112" class="section">YouTube extension</text>
  <rect x="1460" y="145" width="300" height="160" rx="8" class="box"/>
  <text x="1610" y="176" class="label">Four selected</text>
  <text x="1610" y="202" class="label">YouTube videos</text>
  <text x="1610" y="228" class="tiny">Comedy: Offensive Video Games</text>
  <text x="1610" y="250" class="tiny">Gaming: Minecraft War</text>
  <text x="1610" y="272" class="tiny">Lifestyle: day in the life</text>
  <text x="1610" y="294" class="tiny">Pop culture: Unpopular Social Medias</text>

  <rect x="1860" y="145" width="270" height="160" rx="8" class="box"/>
  <text x="1995" y="190" class="label">YouTube Data API</text>
  <text x="1995" y="222" class="small">retrieve comments and</text>
  <text x="1995" y="248" class="small">collection metadata</text>

  <rect x="1860" y="400" width="270" height="160" rx="8" class="box"/>
  <text x="1995" y="440" class="label">Preprocessing</text>
  <text x="1995" y="472" class="small">eligibility screening,</text>
  <text x="1995" y="498" class="small">deduplication and cleaning</text>
  <text x="1995" y="524" class="small">4,000-comment source frame</text>

  <rect x="1860" y="655" width="270" height="130" rx="8" class="box"/>
  <text x="1995" y="698" class="label">Final YouTube sample</text>
  <text x="1995" y="730" class="small">quality-amended</text>
  <text x="1995" y="756" class="small">200-comment cohort</text>

  <rect x="1460" y="910" width="270" height="135" rx="8" class="box"/>
  <text x="1595" y="952" class="label">Human annotation</text>
  <text x="1595" y="984" class="small">two independent annotators</text>
  <text x="1595" y="1010" class="small">sentiment intensity ratings</text>

  <rect x="1075" y="910" width="270" height="135" rx="8" class="box"/>
  <text x="1210" y="952" class="label">Human reference</text>
  <text x="1210" y="984" class="small">mean intensity and polarity</text>
  <text x="1210" y="1010" class="small">agreement is reported</text>

  <rect x="1860" y="910" width="270" height="135" rx="8" class="box"/>
  <text x="1995" y="952" class="label">Model scoring</text>
  <text x="1995" y="984" class="small">VADER 2014, v3.3.2</text>
  <text x="1995" y="1010" class="small">and independent LLM judges</text>

  <rect x="1460" y="1160" width="330" height="135" rx="8" class="box"/>
  <text x="1625" y="1202" class="label">YouTube evaluation</text>
  <text x="1625" y="1234" class="small">agreement, performance and</text>
  <text x="1625" y="1260" class="small">disagreement analysis</text>

  <rect x="280" y="1160" width="430" height="135" rx="8" class="box"/>
  <text x="495" y="1202" class="label">Combined findings and error analysis</text>
  <text x="495" y="1234" class="small">compare replication and new-data results</text>
  <text x="495" y="1260" class="small">across datasets, references and model types</text>

  <path d="M350,210 H465" class="line"/>
  <path d="M735,210 H850" class="line"/>
  <path d="M350,465 H465" class="line"/>
  <path d="M735,465 H850" class="line"/>
  <path d="M1760,225 H1860" class="line"/>
  <path d="M1995,305 V400" class="line"/>
  <path d="M1995,560 V655" class="line"/>
  <path d="M1995,785 V850 H1595 V910" class="line"/>
  <path d="M1995,785 V910" class="line"/>
  <path d="M1595,1045 V1090 H1210 V1045" class="line"/>
  <path d="M1210,1045 V1110 H1625 V1160" class="line"/>
  <path d="M1995,1045 V1227 H1790" class="line"/>
  <path d="M1120,210 H1180 V600 H495 V1160" class="line"/>
  <path d="M985,530 V600 H495 V1160" class="line"/>
  <path d="M1460,1227 H710" class="line"/>
</svg>
